# Daily: find public repos that record agent sessions with Entire, and review each one whose heads moved since its
# last review (scripts/discover.ts). Reviews run as review.yml, one run per repo.
name: discover
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: most reviews to start in this run
        required: false
        default: "25"
      dry_run:
        description: list what would be reviewed, start nothing
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Discover and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          MAX: ${{ inputs.max || '25' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          [[ "$MAX" =~ ^[0-9]{1,3}$ ]] || { echo "::error::max must be a number"; exit 1; }
          bun scripts/discover.ts --max "$MAX" $DRY_RUN | tee -a "$GITHUB_STEP_SUMMARY"
